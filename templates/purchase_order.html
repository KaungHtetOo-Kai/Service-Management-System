{% extends "layout.html" %} 

{% block title %} 
    Purchase Order
{% endblock %} 

{% block main %}

    <h2>Purchase Order</h2>
    <br>
    <div class="border border-dark-subtle border-3 rounded-3 py-3">
        <div class="me-3 ms-3 d-flex gap-3">
            <h5 class="my-auto">Search Purchase Order</h5>
            <div class="ms-auto">
                <button class="btn btn-secondary btn-sm" id="resetTableBtn"  type="button" onclick="executeResetTable()" style="display: none;">Reset Table</button>
                <button class="btn btn-primary btn-sm" id="searchOrderBtn" type="button" onclick="executeOrderSearch()">Search Order</button>
                <button class="btn btn-primary btn-sm" id="createOrderBtn" type="button" onclick="window.location.href='/purchaser_order_create'">Create Order</button>
            </div>   
        </div>
        <br>
        <div class="row row-cols-2 row-cols-lg-6 gy-3 gx-3 me-3 ms-3 align-items-center justify-content-center">
            <div class="col-auto">
                <input id="po_id" class="form-control" name="po_id" autocomplete="off" placeholder="Purchase Order ID" type="text">
            </div>
            <div class="col-auto">
                <input id="merchant" class="form-control" name="merchant" autocomplete="off" placeholder="Merchant Name" type="text">
            </div>
            <div class="col-auto">
                <select id="status" name="status" class="form-select">
                    <option value="all" selected >All</option>
                    <option value="pending" >Pending</option>
                    <option value="approved" >Approved</option>
                    <option value="completed" >completed</option>
                    <option value="cancelled" >Cancelled</option>
                </select>
            </div>
            <div class="col-auto">
                <input id="created_name" class="form-control" name="created_name" autocomplete="off" placeholder="Create Person" type="text">
            </div>
            <div class="col-auto">
                <input id="approved_name" class="form-control" name="approved_name" autocomplete="off" placeholder="Approved Person" type="text">
            </div>
            <div class="col-auto">
                <input id="created_at" class="form-control" name="created_at" autocomplete="off" placeholder="Create time" type="date">
            </div> 
        </div>
        <br>
        <div class="table-responsive mx-3">
            <table class="table table-bordered table-striped">
                <thead class="thead-light">
                    <tr>
                        <th style="width: 3%" >No</th>
                        <th>Order_id</th>
                        <th>Merchant</th>
                        <th>Status</th>
                        <th>Created_by</th>
                        <th>Approved_by</th>
                        <th>Completed_by</th>
                        <th>Total Cost</th>
                        <th>Created Time</th>
                    </tr>
                </thead> 
                <tbody id="PODataTableBody">    
                        <tr class="align-middle"></tr>
                            <!-- JavaScript will write td items here dynamically -->
                        </tr>
                </tbody>               
            </table>
        </div>
        <div class="d-flex justify-content-center mt-3">
            <nav aria-label="Page navigation">
                <ul id="tablePaginationElement" class="pagination pagination-sm mb-0">
                    <!-- JavaScript will write items here dynamically -->
                </ul>
            </nav>
        </div>      
    </div>

{% endblock %}
{% block scripts %}
    <script>
        function checkSearchFieldsValidation() {
            const searchOrderBtn = document.getElementById('searchOrderBtn');
            if (!searchOrderBtn) return;

            // 1. Fetch values from all text inputs elements safely
            const codeVal           = document.getElementById('po_id')          ? document.getElementById('po_id').value.trim()  : '';
            const merchantVal       = document.getElementById('merchant')       ? document.getElementById('merchant').value.trim()  : '';
            const statusVal         = document.getElementById('status')         ? document.getElementById('status').value.trim()  : '';
            const created_nameVal   = document.getElementById('created_name')   ? document.getElementById('created_name').value.trim() : '';
            const approved_nameVal  = document.getElementById('approved_name')  ? document.getElementById('approved_name').value.trim() : '';
            const created_atVal     = document.getElementById('created_at')     ? document.getElementById('created_at').value.trim(): '';

            // 2. Determine if every single filtering input element is completely blank
            const isAllFieldsEmpty = (!codeVal && !merchantVal && statusVal === 'all' && !created_nameVal && !approved_nameVal && !created_atVal);

            // 3. Dynamically manage HTML properties and core structural classes
            if (isAllFieldsEmpty) {
                searchOrderBtn.disabled = true;                // Hard blocks all browser click interaction pathways
                searchOrderBtn.classList.add('disabled');      // Formally injects Bootstrap's muted disabled opacity look
            } else {
                searchOrderBtn.disabled = false;               // Activates the node engine element properties
                searchOrderBtn.classList.remove('disabled');   // Fully restores interactive colors
            }
        }
    
    // ==========================================
    // 2. pagination element rendering
    // ==========================================
    /**
     * Renders the HTML button layout controls dynamically underneath the data grids.
     * @param {object} metadata - Holds pagination counts (current_page, total_pages, total_records)
     */
    function renderPaginationControls(metadata) {
        const paginationUl = document.getElementById('tablePaginationElement');
        if (!paginationUl) return;

        // --- CONDITION LOOK: Hide pagination entirely if total records are less than or equal to 10 ---
        if (!metadata || metadata.total_pages <= 1) {
            paginationUl.innerHTML = ''; // Clears container layout out of sight
            return;
        }

        let htmlMarkup = '';

        // 1. Build the "Previous" directional control element button
        const isPrevDisabled = metadata.current_page === 1;
        htmlMarkup += `
            <li class="page-item ${isPrevDisabled ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changeTablePage(${metadata.current_page - 1}, event)" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
        `;

        // 2. Loop through and draw sequential numeric page numbers
        for (let i = 1; i <= metadata.total_pages; i++) {
            const isActive = metadata.current_page === i;
            htmlMarkup += `
                <li class="page-item ${isActive ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changeTablePage(${i}, event)">${i}</a>
                </li>
            `;
        }

        // 3. Build the "Next" directional control element button
        const isNextDisabled = metadata.current_page === metadata.total_pages;
        htmlMarkup += `
            <li class="page-item ${isNextDisabled ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changeTablePage(${metadata.current_page + 1}, event)" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        `;

        paginationUl.innerHTML = htmlMarkup;
    }

    /** Function called when a user selects a page index button link element */
    function changeTablePage(targetPageNumber, event) {
        if (event) event.preventDefault();
        // Fire search routine passing along targeted page tracking arguments
        executeOrderSearch(targetPageNumber);
    }

    
    // ==========================================
    // 3. DYNAMIC MULTI-FIELD SEARCH REFRESH
    // ==========================================

    function executeOrderSearch(pageNumber = 1) {
        currentActivePage = pageNumber;

        // Collect whatever input data values currently exist inside your search elements
        const codeVal           = document.getElementById('po_id')          ? document.getElementById('po_id').value.trim()  : '';
        const merchantVal       = document.getElementById('merchant')       ? document.getElementById('merchant').value.trim()  : '';
        const statusVal         = document.getElementById('status')         ? document.getElementById('status').value.trim()  : '';
        const created_nameVal   = document.getElementById('created_name')   ? document.getElementById('created_name').value.trim() : '';
        const approved_nameVal  = document.getElementById('approved_name')  ? document.getElementById('approved_name').value.trim() : '';
        const created_atVal     = document.getElementById('created_at')     ? document.getElementById('created_at').value.trim(): '';

        const urlParams = new URLSearchParams();
        urlParams.append('page', currentActivePage); // Append targeted limit mapping page key
        
        if (codeVal)            urlParams.append('po_id', codeVal);
        if (merchantVal)        urlParams.append('merchant', merchantVal);
        if (statusVal)          urlParams.append('status', statusVal);
        if (created_nameVal)    urlParams.append('created_name', created_nameVal);
        if (approved_nameVal)   urlParams.append('approved_name', approved_nameVal);
        if (created_atVal)      urlParams.append('created_at', created_atVal);

        const targetUrl = `/search_purchase_order/?${urlParams.toString()}`;

        // Dispatch the network fetch request package over your dynamic universal gateway
        sendServerRequest(targetUrl, function(data) {
            if (data.status === "success") {
                // A. Update table row contents matching current 10-row dataset layout array
                renderDynamicTableRows(data.po_data);
                
                // B. Recalculate and render the pagination controls underneath
                renderPaginationControls(data.pagination);
                
                // C. Show Reset Table UI controls button if a user actually searched criteria text inputs
                const isFilteringActive = (codeVal || merchantVal || statusVal !== 'all' || created_nameVal || approved_nameVal || created_atVal);
                const resetBtn = document.getElementById('resetTableBtn');
                if (resetBtn) {
                    resetBtn.style.display = isFilteringActive ? 'inline-block' : 'none';
                }
            } else {
                showModal("error", data.message || "Query indexing operation failed.");
            }
        });
    }

    // ==========================================
    // 6. DYNAMIC TABLE GENERATION BUILDER
    // ==========================================
    function renderDynamicTableRows(PODataArray) {
        const tbody = document.getElementById('PODataTableBody');
        if (!tbody) return;

        // Clear existing inner markup completely to make room for fresh search matches
        tbody.innerHTML = '';

        // Handle empty results display state tracking constraints
        if (!PODataArray || PODataArray.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center text-muted py-4 fw-medium">
                        No Purchase Order records match your active filtering parameters.
                    </td>
                </tr>`;
            return;
        }

        // Process elements one by one from the array stream
        PODataArray.forEach((po,index) => {

            const row = document.createElement('tr');
            row.className = "align-middle";

            const isCancelled = (po.status === "CANCELLED");
            const isApproved = (po.status === "APPROVED")
            
            // Injecting the data rows into layout slots using template literal string values
            row.innerHTML = `
                <td class="text-center" style="width: 3%;">${index + 1}</td>
                <td>
                    <a href="/purchase_order_details/?po_id=${po.po_id || ''}">${po.po_id || ''}</a>
                </td>
                <td>${po.merchant || ''}</td>
                <td ${isCancelled ? `class = text-danger` : ``} ${isApproved ? `class = text-success` : ``}>${po.status || ''}</td>
                <td>${po.created_name || ''}</td>
                <td>${po.approved_name || 'NA'}</td>
                <td>${po.completed_name || 'NA'}</td>
                <td class="text-end fw-semibold">MMK ${parseFloat(po.total_cost || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${po.created_at || ''}</td>
            `;

            tbody.appendChild(row);
        });
    }

    // ==========================================
    // 8. THE RESET TABLE ACTIONS ENGINE
    // ==========================================
    function executeResetTable() {
        // 1. Target and wipe text data fields cleanly
        if (document.getElementById('po_id'))       document.getElementById('po_id').value = '';
        if (document.getElementById('merchant'))    document.getElementById('merchant').value = '';
        if (document.getElementById('status'))      document.getElementById('status').value = 'all';
        if (document.getElementById('created_name'))  document.getElementById('created_name').value = '';
        if (document.getElementById('approved_name')) document.getElementById('approved_name').value = '';
        if (document.getElementById('created_at'))  document.getElementById('created_at').value = '';

        // 3. Since inputs are now empty, fire validation to re-disable the main search button
        checkSearchFieldsValidation();

        // 4. Fire an empty query parameter string to fetch Page 1. 
        // Since JavaScript just reset the dropdown to '1', URLSearchParams will append 
        // page=1&active=1 automatically through executeInventorySearch(1)
        if (typeof executeOrderSearch === "function") {
            executeOrderSearch(1);
            const resetBtn = document.getElementById('resetTableBtn');
            if (resetBtn) resetBtn.style.display = 'none';
        } else {
            showModal("error", data.message || "Could not re-fetch default dataset structures.");      
        }
    }

    // ==========================================
    // .Listener Event Block
    // ==========================================
    document.addEventListener('DOMContentLoaded', function() {
        // Define both active form types operating on the workspace page
        const inputIdsList = ['po_id', 'merchant', 'status', 'created_name', 'approved_name', 'created_at'];
        inputIdsList.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', checkSearchFieldsValidation);
                el.addEventListener('change', checkSearchFieldsValidation);
            }
        });
        checkSearchFieldsValidation();
        executeOrderSearch(1); // Initial load of the table with default data
    });
    </script>
{% endblock %}
