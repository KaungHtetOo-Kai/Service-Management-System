{% extends "layout.html" %} 

{% block title %} 
    Inventory details
{% endblock %} 

{% block main %}

    <h2>Inventory Details</h2>
    <br>
    <div class="border border-dark-subtle border-3 rounded-3 py-3">
        <div class="me-3 ms-3 d-flex gap-3">
            <h5 class="my-auto">Inventory Details</h5>
            <div class="ms-auto">
                <button class="btn btn-secondary btn-sm" id="resetTableBtn"  type="button" onclick="executeResetTable()" style="display: none;">Reset Table</button>
                <button class="btn btn-primary btn-sm" id="searchInventoryBtn" type="button" onclick="executeInventorySearch()">Search Inventory</button>
            </div>   
        </div>
        <br>
        <div class="row row-cols-2 row-cols-lg-6 gy-3 gx-3 me-3 ms-3 align-items-center justify-content-center">
            <div class="col-auto">
                <input id="code" class="form-control" name="code" autocomplete="off" placeholder="Code" type="text">
            </div>
            <div class="col-auto">
                <input id="name" class="form-control" name="name" autocomplete="off" placeholder="Name" type="text">
            </div>
            <div class="col-auto">
                <input id="model" class="form-control" name="model" autocomplete="off" placeholder="Phone Model" type="text">
            </div>
            <div class="col-auto">
                <select class="form-select" id="center_id" name="center_id" required>
                    {% for center in centers %}
                    <option value="{{center.center_id}}" {% if center.center_id == session['center_id'] %}selected{% endif %}>{{center.name}} ({{center.center_id}})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <select id="active" name="active" class="form-select">
                    <option value="1" selected>Active</option>
                    <option value="0" >Inactive</option>
                </select>
            </div>
            <div class="col-auto">
                <select id="inStock" name="inStock" class="form-select">
                    <option value="1" selected>In Stock</option>
                    <option value="0" >ALL</option>
                </select>
            </div>
        </div>
        <br>
        <div class="table-responsive mx-3">
            <table class="table table-bordered table-striped">
                <thead class="thead-light">
                    <tr>
                        <th style="width: 3%" >No</th>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Model</th>
                        <th>Price</th>
                        <th>Stock Quantity</th>
                        <th>Create Time</th>
                    </tr>
                </thead> 
                <tbody id="inventoryTableBody">    
                        <tr class="align-middle"></tr>
                            <!-- JavaScript will write td items here dynamically -->
                        </tr>
                </tbody>               
            </table>
        </div>
        <div class="d-flex justify-content-center mt-3">
            <nav aria-label="Page navigation">
                <ul id="tablePaginationElement" class="pagination pagination-sm mb-0">
                    <!-- JavaScript will write items here dynamically -->
                </ul>
            </nav>
        </div>      
    </div>

{% endblock %}

{% block scripts %}

<script>

    // Global tracking variable keeping track of active page state shifts
    let currentActivePage = 1;

    /**
     * 1. Monitors all 6 filtering fields to toggle the search Button's disabled state.
     * Prevents empty submissions that trigger backend 404/500 routing anomalies.
     */
    function checkSearchFieldsValidation() {
        const searchInventoryBtn = document.getElementById('searchInventoryBtn');
        if (!searchInventoryBtn) return;

        // 1. Fetch values from all text inputs elements safely
        const codeVal       = document.getElementById('code')       ? document.getElementById('code').value.trim()  : '';
        const nameVal       = document.getElementById('name')       ? document.getElementById('name').value.trim()  : '';
        const modelVal      = document.getElementById('model')      ? document.getElementById('model').value.trim() : '';
        const centerIdVal   = document.getElementById('center_id')  ? document.getElementById('center_id').value.trim()  : '';
        const activeVal     = document.getElementById('active')     ? document.getElementById('active').value.trim(): '';
        const inStockVal    = document.getElementById('inStock')    ? document.getElementById('inStock').value.trim(): '';

        // 2. Determine if every single filtering input element is completely blank
        const isAllFieldsEmpty = (!codeVal && !nameVal && !modelVal && (centerIdVal === CURRENT_USER_CENTER_ID) && (activeVal === '1' || activeVal === '') && (inStockVal === '1' || inStockVal === '') );

        // 3. Dynamically manage HTML properties and core structural classes
        if (isAllFieldsEmpty) {
            searchInventoryBtn.disabled = true;                // Hard blocks all browser click interaction pathways
            searchInventoryBtn.classList.add('disabled');      // Formally injects Bootstrap's muted disabled opacity look
        } else {
            searchInventoryBtn.disabled = false;               // Activates the node engine element properties
            searchInventoryBtn.classList.remove('disabled');   // Fully restores interactive colors
        }
    }

    // ==========================================
    // 2. pagination element rendering
    // ==========================================
    /**
     * Renders the HTML button layout controls dynamically underneath the data grids.
     * @param {object} metadata - Holds pagination counts (current_page, total_pages, total_records)
     */
    function renderPaginationControls(metadata) {
        const paginationUl = document.getElementById('tablePaginationElement');
        if (!paginationUl) return;

        // --- CONDITION LOOK: Hide pagination entirely if total records are less than or equal to 10 ---
        if (!metadata || metadata.total_pages <= 1) {
            paginationUl.innerHTML = ''; // Clears container layout out of sight
            return;
        }

        let htmlMarkup = '';

        // 1. Build the "Previous" directional control element button
        const isPrevDisabled = metadata.current_page === 1;
        htmlMarkup += `
            <li class="page-item ${isPrevDisabled ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changeTablePage(${metadata.current_page - 1}, event)" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
        `;

        // 2. Loop through and draw sequential numeric page numbers
        for (let i = 1; i <= metadata.total_pages; i++) {
            const isActive = metadata.current_page === i;
            htmlMarkup += `
                <li class="page-item ${isActive ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changeTablePage(${i}, event)">${i}</a>
                </li>
            `;
        }

        // 3. Build the "Next" directional control element button
        const isNextDisabled = metadata.current_page === metadata.total_pages;
        htmlMarkup += `
            <li class="page-item ${isNextDisabled ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changeTablePage(${metadata.current_page + 1}, event)" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        `;

        paginationUl.innerHTML = htmlMarkup;
    }

    /** Function called when a user selects a page index button link element */
    function changeTablePage(targetPageNumber, event) {
        if (event) event.preventDefault();
        // Fire search routine passing along targeted page tracking arguments
        executeInventorySearch(targetPageNumber);
    }

    // ==========================================
    // 3. DYNAMIC MULTI-FIELD SEARCH REFRESH
    // ==========================================

    function executeInventorySearch(pageNumber = 1) {
        currentActivePage = pageNumber;

        // Collect whatever input data values currently exist inside your search elements
        const codeVal       = document.getElementById('code')       ? document.getElementById('code').value.trim()  : '';
        const nameVal       = document.getElementById('name')       ? document.getElementById('name').value.trim()  : '';
        const modelVal      = document.getElementById('model')      ? document.getElementById('model').value.trim() : '';
        const centerIdVal   = document.getElementById('center_id')  ? document.getElementById('center_id').value.trim()  : '';
        const activeVal     = document.getElementById('active')     ? document.getElementById('active').value.trim(): '';
        const inStockVal    = document.getElementById('inStock')    ? document.getElementById('inStock').value.trim(): '';
        
        const urlParams = new URLSearchParams();
        urlParams.append('page', currentActivePage); // Append targeted limit mapping page key
        
        if (codeVal)        urlParams.append('code', codeVal);
        if (nameVal)        urlParams.append('name', nameVal);
        if (modelVal)       urlParams.append('model', modelVal);
        if (centerIdVal)    urlParams.append('center_id', centerIdVal);
        if (activeVal)      urlParams.append('active', activeVal);
        if (inStockVal)     urlParams.append('in_stock', inStockVal);

        const targetUrl = `/search_inventory/?${urlParams.toString()}`;

        // Dispatch the network fetch request package over your dynamic universal gateway
        sendServerRequest(targetUrl, function(data) {
            if (data.status === "success") {
                // A. Update table row contents matching current 10-row dataset layout array
                renderDynamicTableRows(data.inventory);
                
                // B. Recalculate and render the pagination controls underneath
                renderPaginationControls(data.pagination);
                
                // C. Show Reset Table UI controls button if a user actually searched criteria text inputs
                const isFilteringActive = (codeVal || nameVal || modelVal || centerIdVal !== CURRENT_USER_CENTER_ID || activeVal === '0' || inStockVal === '0');
                const resetBtn = document.getElementById('resetTableBtn');
                if (resetBtn) {
                    resetBtn.style.display = isFilteringActive ? 'inline-block' : 'none';
                }
            } else {
                showModal("error", data.message || "Query indexing operation failed.");
            }
        });
    }

    // ==========================================
    // 6. DYNAMIC TABLE GENERATION BUILDER
    // ==========================================
    function renderDynamicTableRows(inventoryArray) {
        const tbody = document.getElementById('inventoryTableBody');
        if (!tbody) return;

        // Clear existing inner markup completely to make room for fresh search matches
        tbody.innerHTML = '';

        // Handle empty results display state tracking constraints
        if (!inventoryArray || inventoryArray.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center text-muted py-4 fw-medium">
                        No Inventory records match your active filtering parameters.
                    </td>
                </tr>`;
            return;
        }

        // Process elements one by one from the array stream
        inventoryArray.forEach((inventory,index) => {

            const row = document.createElement('tr');
            row.className = "align-middle";

            
            // Injecting the data rows into layout slots using template literal string values
            row.innerHTML = `
                <td class="text-center" style="width: 3%;">${index + 1}</td>
                <td>${inventory.code || ''}</td>
                <td>${inventory.name || ''}</td>
                <td>${inventory.model || ''}</td>
                <td class="text-end fw-semibold">MMK ${parseFloat(inventory.price).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${inventory.quantity || '0'}</td>
                <td>${inventory.created_at || ''}</td>
            `;

            tbody.appendChild(row);
        });
    }

    // ==========================================
    // 8. THE RESET TABLE ACTIONS ENGINE
    // ==========================================
    function executeResetTable() {
        // 1. Target and wipe text data fields cleanly
        if (document.getElementById('name'))        document.getElementById('name').value = '';
        if (document.getElementById('code'))        document.getElementById('code').value = '';
        if (document.getElementById('model'))       document.getElementById('model').value = '';
        if (document.getElementById('center_id'))   document.getElementById('center_id').value = CURRENT_USER_CENTER_ID;

        // 2. Explicitly force the active dropdown selection back to '1' (Active)
        if (document.getElementById('active')) {
            document.getElementById('active').value = '1';
        }
        if (document.getElementById('inStock')) {
            document.getElementById('inStock').value = '1';
        }

        // 3. Since inputs are now empty, fire validation to re-disable the main search button
        checkSearchFieldsValidation();

        // 4. Fire an empty query parameter string to fetch Page 1. 
        // Since JavaScript just reset the dropdown to '1', URLSearchParams will append 
        // page=1&active=1 automatically through executeInventorySearch(1)
        if (typeof executeInventorySearch === "function") {
            executeInventorySearch(1);
            const resetBtn = document.getElementById('resetTableBtn');
            if (resetBtn) resetBtn.style.display = 'none';
        } else {
            showModal("error", data.message || "Could not re-fetch default dataset structures.");      
        }
    }

    // ==========================================
    // .Listener Event Block
    // ==========================================
    document.addEventListener('DOMContentLoaded', function() {
        // Define both active form types operating on the workspace page
        const inputIdsList = ['code', 'name', 'model','center_id', 'active', 'inStock'];
        inputIdsList.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', checkSearchFieldsValidation);
                el.addEventListener('change', checkSearchFieldsValidation);
            }
        });
        checkSearchFieldsValidation();
        executeInventorySearch(1);
    });

</script>

{% endblock %}
